<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Estilizado</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css&quot; rel="stylesheet">
   
    <!-- Tus estilos personalizados e idénticos a la imagen -->
     <!--El css de un archivo nos sirve para modificar los estilos, colores, tipografia, tamaños, alineaciones, etc.-->
    <style>
        .box {
            max-width: 360px;
            margin: 50px auto;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
            font-family: sans-serif;
            background: #fff;
        }

        .sky {
            height: 120px;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            position: relative;
            text-align: center;
            color: #fff;
            padding-top: 35px;
        }

        .sky h2 {
            margin: 0;
            font-size: 20px;
        }

        .sky p {
            margin: 4px 0 0;
            font-size: 12px;
            opacity: .7;
        }

        /* El truco de la curva blanca inferior */
        .sky::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 30px;
            background: #fff;
            border-radius: 50% 50% 0 0;
        }

        .body {
            padding: 24px;
        }

        .body label {
            display: block;
            font-size: 13px;
            margin: 12px 0 4px;
            color: #444;
        }

        /* Inputs estilizados con el color focus personalizado */
        .body .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .body .form-control:focus {
            outline: none;
            box-shadow: none;
            border-color: #302b63;
        }

        /* Botón con el color corporativo morado oscuro */
        .body .btn-custom {
            width: 100%;
            margin-top: 18px;
            padding: 11px;
            background: #302b63;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .body .btn-custom:hover {
            opacity: .85;
            color: #fff;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Estructura limpia mezclando tus clases y Bootstrap -->
     <!--El html nos permite maquetar la estructura de la página.-->
    <div class="box">
        <div class="sky">
            <h2>Ingreso UDL_IS</h2>
            <p>Crear gratis una cuenta</p>
        </div>

        <div class="body">
            <form>
                <div>
                    <label>Nombre</label>
                    <input type="text" class="form-control" placeholder="Captura nombre de usuario" required>
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="user_name@dominio.com" required>
                </div>

                <div>
                    <label>Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="button" class="btn btn-custom" onclick="alert('Welcome!')">Enviar datos</button>
            </form>
        </div>
    </div>

    <!-- JS de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script&gt;
</body>
</html>

<!-- JAVASCRIPT DIRECTO EN EL MISMO ARCHIVO -->
<!--El JAVASCRIPT nos permite agregar funcionalidad y dinamismo a una página.>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
     
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      // Cargar y leer el archivo XML
      const res = await fetch('usuarios.xml');
      const xmlText = await res.text();
      const xmlDoc = new DOMParser().parseFromString(xmlText, 'application/xml');

      // Buscar si coinciden correo y contraseña
      const usuarios = Array.from(xmlDoc.querySelectorAll('usuario'));
      const existe = usuarios.some(u =>
        u.querySelector('email').textContent === email &&
        u.querySelector('password').textContent === pass
      );

      if (existe) {
        window.location.href = 'dashboard.html'; // Redirección
      } else {
        alert('Usuario o contraseña incorrectos');
      }
    });
  </script>
